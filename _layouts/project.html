---
layout: default
---
<article class="article">
  <div class="wrap">
    <header class="article-head measure">
      <p class="eyebrow">{{ page.role | default: "Case study" }}{% if page.year %} &middot; {{ page.year }}{% endif %}</p>
      <h1>{{ page.title }}</h1>
      {% if page.description %}<p>{{ page.description }}</p>{% endif %}
      {% if page.link %}<p><a class="btn btn-ghost" href="{{ page.link }}" rel="noopener">View live &rarr;</a></p>{% endif %}
    </header>
    {% if page.image %}<img class="cover" src="{{ page.image | relative_url }}" alt="{{ page.title }}">{% endif %}
    <div class="article-body">{{ content }}</div>
    <hr>
    <p class="measure"><a class="read-more" href="{{ '/work/' | relative_url }}">&larr; All work</a></p>
  </div>
</article>
