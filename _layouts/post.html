---
layout: default
---
<article class="article">
  <div class="wrap">
    <header class="article-head measure">
      <p class="eyebrow">{{ page.date | date: "%b %-d, %Y" }}</p>
      <h1>{{ page.title }}</h1>
      {% if page.description %}<p>{{ page.description }}</p>{% endif %}
      {% if page.tags.size > 0 %}
      <div class="tags">{% for t in page.tags %}<span class="tag">{{ t }}</span>{% endfor %}</div>
      {% endif %}
    </header>
    {% if page.image %}<img class="cover" src="{{ page.image | relative_url }}" alt="{{ page.title }}">{% endif %}
    <div class="article-body">{{ content }}</div>
    <hr>
    <p class="measure"><a class="read-more" href="{{ '/blog/' | relative_url }}">&larr; All posts</a></p>
  </div>
</article>
