---
layout: default
---
<article class="article">
  <div class="wrap">
    <header class="article-head measure">
      {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
      <h1>{{ page.title }}</h1>
      {% if page.description %}<p class="muted">{{ page.description }}</p>{% endif %}
    </header>
    <div class="article-body">{{ content }}</div>
  </div>
</article>
