media:
  input: assets/uploads
  output: /assets/uploads

content:
  - name: projects
    label: Design work
    type: collection
    path: _projects
    filename: '{primary}.md'
    view:
      fields: [title, role, year]
      primary: title
      sort: [order, year, title]
    fields:
      - name: title
        label: Project name
        type: string
        required: true
      - name: description
        label: One-line description
        type: text
        required: true
        description: Shows on the homepage card. Keep it to one sentence.
      - name: role
        label: Your role
        type: string
        default: Product Designer
      - name: year
        label: Year
        type: number
      - name: tags
        label: Tags
        type: string
        list: true
      - name: image
        label: Cover image
        type: image
      - name: link
        label: External link
        type: string
        description: Optional. Link to the live product if there is one.
      - name: order
        label: Sort order
        type: number
        description: Lower numbers show first on the homepage.
      - name: layout
        label: Layout
        type: string
        hidden: true
        default: project
      - name: body
        label: Case study
        type: rich-text

  - name: about
    label: About page
    type: file
    path: about.md
    fields:
      - name: title
        label: Title
        type: string
      - name: eyebrow
        label: Eyebrow
        type: string
      - name: description
        label: Subtitle
        type: text
      - name: layout
        type: string
        hidden: true
        default: page
      - name: permalink
        type: string
        hidden: true
        default: /about/
      - name: body
        label: Content
        type: rich-text

  - name: config
    label: Site settings
    type: file
    path: _config.yml
    fields:
      - name: title
        label: Site title
        type: string
      - name: tagline
        label: Tagline
        type: string
      - name: description
        label: Site description
        type: text
      - name: author
        label: Author
        type: string
