{%- comment -%}
Article structured data. jekyll-seo-tag emits WebSite/Person; this adds the
per-page Article payload Google uses for rich results.
{%- endcomment -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "{{ include.type | default: 'Article' }}",
  "headline": {{ page.title | jsonify }},
  "description": {{ page.description | jsonify }},
  "url": "{{ page.url | absolute_url }}",
  "mainEntityOfPage": { "@type": "WebPage", "@id": "{{ page.url | absolute_url }}" },
  {%- if page.image and page.image != "" %}
  "image": ["{{ page.image | absolute_url }}"],
  {%- endif %}
  {%- if page.date %}
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  "dateModified": "{{ page.date | date_to_xmlschema }}",
  {%- endif %}
  {%- if page.category %}
  "articleSection": {{ page.category | jsonify }},
  {%- endif %}
  {%- if page.tags and page.tags != empty %}
  "keywords": {{ page.tags | join: ", " | jsonify }},
  {%- endif %}
  "inLanguage": "en",
  "author": {
    "@type": "Person",
    "name": {{ site.author | jsonify }},
    "url": "{{ site.url }}/about/",
    "jobTitle": {{ site.tagline | jsonify }},
    "sameAs": {{ site.social.links | jsonify }}
  },
  "publisher": {
    "@type": "Person",
    "name": {{ site.author | jsonify }},
    "url": "{{ site.url }}/"
  }
}
</script>
