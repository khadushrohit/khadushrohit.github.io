<article class="post-item">
  <p class="muted">{{ include.post.date | date: "%b %-d, %Y" }}</p>
  <h3><a href="{{ include.post.url | relative_url }}">{{ include.post.title }}</a></h3>
  <p>{{ include.post.description | default: include.post.excerpt | strip_html | truncate: 180 }}</p>
  <a class="read-more" href="{{ include.post.url | relative_url }}">Read full post &rarr;</a>
</article>
