# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
backend:
  name: github
  repo: khadushrohit/khadushrohit.github.io
  branch: main

site_url: https://rohitdesigner.in
display_url: https://rohitdesigner.in

media_folder: assets/uploads
public_folder: /assets/uploads

collections:
  - name: projects
    label: Design work
    label_singular: Case study
    folder: _projects
    create: true
    delete: true
    extension: md
    format: yaml-frontmatter
    slug: '{{slug}}'
    summary: '{{title}} — {{year}}'
    sortable_fields: [order, year, title]
    fields:
      - { label: Project name, name: title, widget: string }
      - {
          label: One-line description,
          name: description,
          widget: text,
          hint: Shows on the homepage card. Keep it to one sentence.,
        }
      - { label: Your role, name: role, widget: string, default: Product Designer }
      - { label: Date, name: date, widget: datetime, required: false, format: 'YYYY-MM-DD HH:mm:ss' }
      - { label: Year, name: year, widget: number, value_type: int, required: false }
      - { label: Tags, name: tags, widget: list, required: false }
      - { label: Cover image, name: image, widget: image, required: false }
      - {
          label: External link,
          name: link,
          widget: string,
          required: false,
          hint: Optional. Link to the live product if there is one.,
        }
      - {
          label: Sort order,
          name: order,
          widget: number,
          value_type: int,
          required: false,
          hint: Lower numbers show first on the homepage.,
        }
      - { label: Layout, name: layout, widget: hidden, default: project }
      - { label: Case study, name: body, widget: richtext }

  - name: blog
    label: Writing
    label_singular: Blog post
    folder: _blog
    create: true
    delete: true
    extension: md
    format: yaml-frontmatter
    slug: '{{slug}}'
    summary: '{{title}}'
    sortable_fields: [date, title, category]
    view_groups:
      - { label: Category, field: category }
    fields:
      - { label: Layout, name: layout, widget: hidden, default: post }
      - { label: Post title, name: title, widget: string }
      - {
          label: Excerpt,
          name: description,
          widget: text,
          hint: One or two sentences. Shows on the writing list and in Google results.,
        }
      - { label: Published, name: date, widget: datetime, format: 'YYYY-MM-DD HH:mm:ss' }
      - {
          label: Category,
          name: category,
          widget: select,
          options: [Design career, UX, Psychology, Landing pages, Marketing, Money, Mental health, Life],
        }
      - { label: Tags, name: tags, widget: list, required: false }
      - { label: Cover image, name: image, widget: image, required: false }
      - { label: Post, name: body, widget: richtext }

  - name: pages
    label: Pages
    files:
      - name: about
        label: About page
        file: about.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Eyebrow, name: eyebrow, widget: string, required: false }
          - { label: Subtitle, name: description, widget: text, required: false }
          - { label: Portrait image, name: portrait, widget: image, required: false }
          - { label: Portrait caption, name: portrait_caption, widget: string, required: false }
          - { label: Layout, name: layout, widget: hidden, default: about }
          - { label: Permalink, name: permalink, widget: hidden, default: /about/ }
          - { label: Content, name: body, widget: richtext }

  - name: homepage
    label: Homepage
    files:
      - name: homepage_data
        label: Homepage content
        file: _data/homepage.yml
        description: Hero portrait, the client logo strip, and the Medium articles listed at the bottom of the Writing page.
        fields:
          - { label: Hero portrait, name: portrait, widget: image, required: false }
          - label: Client strip
            name: clients
            widget: list
            fields:
              - { label: Company name, name: name, widget: string }
              - { label: Logo, name: logo, widget: image }
          - label: Medium articles
            name: articles
            widget: list
            max: 4
            summary: '{{fields.title}}'
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Excerpt, name: excerpt, widget: text }
              - { label: Published, name: date, widget: datetime, format: 'YYYY-MM-DD', time_format: false }
              - { label: Medium URL, name: url, widget: string }
