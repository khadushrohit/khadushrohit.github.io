title: Rohit Singh
tagline: Product Designer
description: >-
  Design work and case studies by Rohit Singh — product designer specialising in SaaS websites and web apps.
author: Rohit Singh
# Absolute site URL. Canonical tags and the sitemap derive from this.
url: "https://rohitdesigner.in"
baseurl: ""

permalink: /:title/

lang: en_IN

# jekyll-seo-tag reads these to emit the Person JSON-LD and Twitter card.
social:
  name: Rohit Singh
  links:
    - https://www.linkedin.com/in/rohit-singh-designer/
    - https://medium.com/@rohitdesigner
    - https://twitter.com/Rohitsi00372049
    - https://dribbble.com/khadush
    - https://www.instagram.com/khadush_rohit/

twitter:
  username: Rohitsi00372049
  card: summary_large_image

# Footer links, keyed by name.
links:
  twitter: https://twitter.com/Rohitsi00372049
  linkedin: https://www.linkedin.com/in/rohit-singh-designer/
  medium: https://medium.com/@rohitdesigner
  dribbble: https://dribbble.com/khadush
  instagram: https://www.instagram.com/khadush_rohit/

collections:
  projects:
    output: true
    permalink: /:name/
  blog:
    output: true
    permalink: /blog/:name/

defaults:
  - scope: { path: "", type: "projects" }
    values: { layout: "project" }
  - scope: { path: "", type: "blog" }
    values: { layout: "post" }
  - scope: { path: "" }
    values: { layout: "page" }

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
