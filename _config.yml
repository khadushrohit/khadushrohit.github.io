title: Rohit Singh
tagline: Product Designer
description: >-
  Design work and case studies by Rohit Singh — product designer specialising in SaaS websites and web apps.
author: Rohit Singh
# Absolute site URL. Change this ONE line to https://rohitdesigner.in when the
# domain is connected — canonical tags and the sitemap follow automatically.
url: "https://khadushrohit.github.io"
baseurl: ""

permalink: /:title/

social:
  twitter: https://twitter.com/Rohitsi00372049
  linkedin: https://www.linkedin.com/in/rohit-singh-designer/
  medium: https://medium.com/@rohitdesigner
  dribbble: https://dribbble.com/khadush
  instagram: https://www.instagram.com/khadush_rohit/

collections:
  projects:
    output: true
    permalink: /:name/

defaults:
  - scope: { path: "", type: "projects" }
    values: { layout: "project" }
  - scope: { path: "" }
    values: { layout: "page" }

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
